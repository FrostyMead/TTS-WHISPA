[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "murmr"
version = "0.6.0"
description = "Local, cross-platform push-to-talk dictation powered by NVIDIA Parakeet"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "onnx-asr[hub]>=0.12",
  "numpy>=1.24",
  "sounddevice>=0.4.6",
  "pynput>=1.7.7",
  "PySide6-Essentials>=6.6",
  "pyperclip>=1.8",
  "soundcard>=0.4.4; sys_platform == 'win32'",  # computer audio for meeting notes
  "espeakng-loader>=0.2.4",  # pronunciation for the read-aloud voice
  "cryptography>=42",  # encrypted sync between your computers (sync.py)
  "keyring>=25",  # the optional AI API key lives in the system credential store
  "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
  "pyobjc-framework-AVFoundation>=10; sys_platform == 'darwin'",
  "comtypes>=1.4; sys_platform == 'win32'",
]

# Pick exactly one ONNX Runtime flavour (they install the same module and conflict).
[project.optional-dependencies]
cpu = ["onnxruntime>=1.20"]
cuda = ["onnxruntime-gpu[cuda,cudnn]>=1.21"]
directml = ["onnxruntime-directml>=1.20"]
dev = ["pytest>=8"]

[project.gui-scripts]
murmr = "whispa.__main__:main"

[project.scripts]
murmr-cli = "whispa.__main__:main"

[tool.setuptools]
packages = ["whispa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
