# Builds Murmr's small native macOS programs as universal binaries:
#   mac/launcher.c     -> whispa/resources/MurmrLauncher   (Murmr.app's executable)
#   mac/audiotap.swift -> whispa/resources/murmr-audiotap  (computer audio for meetings)
#   mac/applellm.swift -> whispa/resources/murmr-applellm  (Apple's on-device AI model)
# The results are committed, so installs don't need Xcode. Run it (Actions tab or
# `gh workflow run mac-launcher.yml`) after changing the source, then commit the artifact.
# Don't recommit an unchanged launcher: a new binary makes macOS forget Murmr's permissions.
name: macOS launcher

on:
  push:
    branches: [main]
    paths: ["mac/**", "whispa/resources/MurmrLauncher", ".github/workflows/mac-launcher.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          clang -O2 -Wall -Werror -arch arm64 -arch x86_64 -mmacosx-version-min=11.0 \
            -o MurmrLauncher mac/launcher.c
          lipo -info MurmrLauncher
      - name: Smoke test
        run: |
          set -e
          app=/tmp/T.app
          mkdir -p $app/Contents/MacOS $app/Contents/Resources
          cp MurmrLauncher $app/Contents/MacOS/T
          printf '/bin/sh\n-c\necho "bundle=$WHISPA_BUNDLE args=$*"; exit 3\nsh\n' > $app/Contents/Resources/command
          out=$($app/Contents/MacOS/T one "two words" -psn_0_1 || echo "exit=$?")
          echo "$out"
          echo "$out" | grep -q 'bundle=1 args=one two words'
          echo "$out" | grep -q 'exit=3'
      - name: Build the audio helper
        run: |
          set -e
          swiftc -O -target arm64-apple-macos13.0 -o tap-arm64 mac/audiotap.swift
          swiftc -O -target x86_64-apple-macos13.0 -o tap-x86_64 mac/audiotap.swift
          lipo -create -output murmr-audiotap tap-arm64 tap-x86_64
          codesign --force --sign - murmr-audiotap
          lipo -info murmr-audiotap
          out=$(./murmr-audiotap --check)
          echo "check: $out"
          echo "$out" | grep -Eq '^(granted|denied)$'
      - name: Capture smoke test (informational)
        continue-on-error: true
        run: |
          sleep 20 | ./murmr-audiotap > /tmp/out.raw 2> /tmp/err.txt &
          sleep 4
          for i in 1 2 3; do afplay /System/Library/Sounds/Ping.aiff || true; done
          sleep 2
          pkill -f murmr-audiotap || true
          sleep 1
          echo "stderr:"; cat /tmp/err.txt
          ls -la /tmp/out.raw
          python3 -c "import array,math; a=array.array('f'); a.frombytes(open('/tmp/out.raw','rb').read()[:(len(open('/tmp/out.raw','rb').read())//4)*4]); print(len(a)/48000,'s', 'peak', max(map(abs,a)) if a else 0)"
      - uses: actions/upload-artifact@v4
        with:
          name: MurmrLauncher
          path: MurmrLauncher
      - uses: actions/upload-artifact@v4
        with:
          name: murmr-audiotap
          path: murmr-audiotap

  applellm:
    # Apple's Foundation Models framework needs the macOS 26 SDK (Xcode 26).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build the Apple AI helper
        run: |
          set -e
          xcodebuild -version
          xcrun --show-sdk-version
          swiftc -O -target arm64-apple-macos13.0 -Xlinker -weak_framework -Xlinker FoundationModels \
            -o murmr-applellm mac/applellm.swift
          codesign --force --sign - murmr-applellm
          lipo -info murmr-applellm
      - name: Smoke test
        run: |
          set -e
          cat > req.jsonl <<'EOF'
          {"id":1,"op":"availability"}
          {"id":2,"op":"generate","instructions":"Reply with one word.","prompt":"Say hello"}
          EOF
          out=$(sed 's/^ *//' req.jsonl | ./murmr-applellm)
          echo "$out"
          echo "$out" | grep -q '"id":1'
          if echo "$out" | grep -q notBuilt; then echo "built without FoundationModels"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: murmr-applellm
          path: murmr-applellm
